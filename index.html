<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>آب‌وهوای ارومیه</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      padding: 25px 0;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #cbd5e1;
      font-size: 15px;
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .city {
      font-size: 27px;
      margin-bottom: 15px;
    }

    .temperature {
      font-size: 70px;
      font-weight: bold;
      margin: 10px 0;
    }

    .status {
      font-size: 20px;
      color: #e2e8f0;
      margin-bottom: 25px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .detail {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 18px 10px;
    }

    .detail span {
      display: block;
      color: #cbd5e1;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .detail strong {
      font-size: 18px;
    }

    .forecast {
      margin-top: 25px;
    }

    .forecast h2 {
      margin-bottom: 15px;
      font-size: 22px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .day {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 20px 10px;
      text-align: center;
    }

    .day-name {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .day-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .day-temp {
      font-size: 17px;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #cbd5e1;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      header h1 {
        font-size: 25px;
      }

      .weather-card {
        padding: 22px 15px;
      }

      .temperature {
        font-size: 58px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .days {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🌤️ آب‌وهوای ارومیه</h1>
      <p>آخرین وضعیت آب‌وهوا و پیش‌بینی روزهای آینده</p>
    </header>

    <section class="weather-card">

      <div class="city">ارومیه</div>

      <div class="temperature">
        18°C
      </div>

      <div class="status">
        ☀️ صاف
      </div>

      <div class="details">

        <div class="detail">
          <span>💧 رطوبت</span>
          <strong>45٪</strong>
        </div>

        <div class="detail">
          <span>💨 سرعت باد</span>
          <strong>12 km/h</strong>
        </div>

        <div class="detail">
          <span>🌡️ احساس دما</span>
          <strong>17°C</strong>
        </div>

      </div>

    </section>

    <section class="forecast">

      <h2>پیش‌بینی روزهای آینده</h2>

      <div class="days">

        <div class="day">
          <div class="day-name">امروز</div>
          <div class="day-icon">☀️</div>
          <div class="day-temp">18° / 8°</div>
        </div>

        <div class="day">
          <div class="day-name">فردا</div>
          <div class="day-icon">🌤️</div>
          <div class="day-temp">20° / 9°</div>
        </div>

        <div class="day">
          <div class="day-name">پس‌فردا</div>
          <div class="day-icon">⛅</div>
          <div class="day-temp">19° / 7°</div>
        </div>

        <div class="day">
          <div class="day-name">روز چهارم</div>
          <div class="day-icon">🌧️</div>
          <div class="day-temp">16° / 6°</div>
        </div>

        <div class="day">
          <div class="day-name">روز پنجم</div>
          <div class="day-icon">☁️</div>
          <div class="day-temp">15° / 5°</div>
        </div>

      </div>

    </section>

    <footer>
      سامانه آب‌وهوای ارومیه
    </footer>

  </div>

</body>
  </html>
