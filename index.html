<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#eaf3f7;--bg2:#f7efe9;--card:#ffffffcc;--ink:#12303f;--mute:#5d7885;--line:#12303f1a;
  --lake:#0e5a7a;--salt:#f3d9d0;
}
@media (prefers-color-scheme:dark){
  :root{--bg1:#0b1c26;--bg2:#1a1720;--card:#13293699;--ink:#e8f1f5;--mute:#93aab6;--line:#ffffff1f;--lake:#6cc3e3;--salt:#5b3b3b}
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%) fixed;
  padding:0 0 env(safe-area-inset-bottom,0px);line-height:1.7;
}
header{
  background:var(--lake);color:#fff;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 22px;
  border-bottom:6px solid var(--salt);
}
header h1{font-size:clamp(1.05rem,3.6vw,1.75rem);font-weight:800;letter-spacing:0}
main{max-width:980px;margin:0 auto;padding:22px 16px 40px;display:grid;gap:16px}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:20px}
.now{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.now .city{font-size:1.25rem;font-weight:600}
.now .date{color:var(--mute);font-size:.9rem}
.temp{font-size:clamp(4rem,16vw,6.5rem);font-weight:300;line-height:1}
.temp small{font-size:.35em;font-weight:400;color:var(--mute)}
.cond{font-size:1.1rem}
.icon{font-size:clamp(4rem,14vw,6rem);line-height:1}
.aqi-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
.aqi-top h2{font-size:1.1rem;font-weight:600}
.aqi-val{font-size:3rem;font-weight:800;line-height:1}
.aqi-label{font-size:1.15rem;font-weight:600}
.scale{position:relative;height:16px;border-radius:99px;margin:22px 0 8px;
  background:linear-gradient(to left,#7e0023 0%,#8f3f97 20%,#e8383d 40%,#ff7e00 60%,#f2c200 80%,#2e9e5b 100%)}
.scale i{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--card);
  border:4px solid var(--ink);transform:translate(50%,-50%);transition:right .8s cubic-bezier(.2,.8,.2,1)}
.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:.75rem;direction:ltr;flex-direction:row-reverse}
.advice{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--salt);color:#3a2320;font-size:.95rem}
@media (prefers-color-scheme:dark){.advice{color:#f3dcd7}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.cell{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cell span{display:block;color:var(--mute);font-size:.82rem}
.cell b{font-size:1.25rem;font-weight:600}
.cell em{font-style:normal;font-size:.75rem;color:var(--mute);margin-inline-start:4px}
h3{font-size:1rem;font-weight:600;margin-bottom:12px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.day{text-align:center;border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.day .n{font-size:.9rem;color:var(--mute)}
.day .e{font-size:1.9rem;line-height:1.4}
.day .t{font-weight:600}
.day .t small{color:var(--mute);font-weight:400}
footer{text-align:center;color:var(--mute);font-size:.78rem;padding-top:4px}
.msg{text-align:center;padding:40px 16px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.scale i{transition:none}}
:focus-visible{outline:3px solid var(--lake);outline-offset:2px}
</style>
</head>
<body>
<header><h1>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</h1></header>
<main id="app"><div class="card msg">در حال دریافت اطلاعات…</div></main>

<script>
const LAT = 37.5527, LON = 45.0761;
const fa = (n, d = 0) => Number(n).toLocaleString("fa-IR", {maximumFractionDigits: d, minimumFractionDigits: d});

const WMO = {
  0:["آسمان صاف","☀️"],1:["کمی ابری","🌤️"],2:["نیمه‌ابری","⛅"],3:["ابری","☁️"],
  45:["مه‌آلود","🌫️"],48:["مه یخ‌زده","🌫️"],
  51:["نم‌نم باران","🌦️"],53:["نم‌نم باران","🌦️"],55:["نم‌نم شدید","🌦️"],
  61:["باران ملایم","🌧️"],63:["باران","🌧️"],65:["باران شدید","🌧️"],
  66:["باران یخ‌زده","🌧️"],67:["باران یخ‌زده","🌧️"],
  71:["برف ملایم","🌨️"],73:["برف","❄️"],75:["برف سنگین","❄️"],77:["دانه‌های برف","❄️"],
  80:["رگبار","🌦️"],81:["رگبار","🌧️"],82:["رگبار شدید","⛈️"],
  85:["رگبار برف","🌨️"],86:["رگبار برف","🌨️"],
  95:["رعد و برق","⛈️"],96:["رعد و تگرگ","⛈️"],99:["رعد و تگرگ شدید","⛈️"]
};
const AQI = [
  [50,"هوای پاک","#2e9e5b","کیفیت هوا مطلوب است و فعالیت در فضای باز مشکلی ندارد."],
  [100,"قابل قبول","#b89400","برای اغلب افراد مناسب است؛ افراد بسیار حساس مراقب باشند."],
  [150,"ناسالم برای گروه‌های حساس","#ff7e00","کودکان، سالمندان و بیماران قلبی و تنفسی فعالیت طولانی در بیرون را کاهش دهند."],
  [200,"ناسالم","#e8383d","همه افراد فعالیت سنگین در فضای باز را محدود کنند."],
  [300,"بسیار ناسالم","#8f3f97","از فعالیت در فضای باز پرهیز و از ماسک استفاده کنید."],
  [Infinity,"خطرناک","#7e0023","شرایط اضطراری؛ در محیط بسته بمانید."]
];
const aqiInfo = v => AQI.find(a => v <= a[0]);

const wind = d => ["شمال","شمال‌شرق","شرق","جنوب‌شرق","جنوب","جنوب‌غرب","غرب","شمال‌غرب"][Math.round(d/45)%8];
const dayName = s => new Intl.DateTimeFormat("fa-IR",{weekday:"long"}).format(new Date(s+"T12:00:00"));

async function load(){
  const w = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
    + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=Asia%2FTehran&forecast_days=7`;
  const a = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}`
    + `&current=us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide&timezone=Asia%2FTehran`;
  const [W, A] = await Promise.all([fetch(w).then(r=>r.json()), fetch(a).then(r=>r.json())]);
  render(W, A);
}

function render(W, A){
  const c = W.current, d = W.daily, q = A.current;
  const [cond, emoji] = WMO[c.weather_code] || ["نامشخص","🌡️"];
  const aq = Math.round(q.us_aqi), info = aqiInfo(aq);
  const pos = Math.min(aq, 300) / 300 * 100;
  const today = new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());

  const poll = [
    ["ذرات PM2.5", q.pm2_5, "µg/m³"],["ذرات PM10", q.pm10, "µg/m³"],
    ["ازن", q.ozone, "µg/m³"],["دی‌اکسید نیتروژن", q.nitrogen_dioxide, "µg/m³"],
    ["دی‌اکسید گوگرد", q.sulphur_dioxide, "µg/m³"],["مونوکسید کربن", q.carbon_monoxide, "µg/m³"]
  ].map(p => `<div class="cell"><span>${p[0]}</span><b>${fa(p[1],1)}</b><em>${p[2]}</em></div>`).join("");

  const days = d.time.map((t,i)=>`
    <div class="day"><div class="n">${i===0?"امروز":dayName(t)}</div>
    <div class="e">${(WMO[d.weather_code[i]]||["","🌡️"])[1]}</div>
    <div class="t">${fa(d.temperature_2m_max[i])}° <small>${fa(d.temperature_2m_min[i])}°</small></div>
    <div class="n">🌧 ${fa(d.precipitation_probability_max[i]??0)}٪</div></div>`).join("");

  document.getElementById("app").innerHTML = `
  <section class="card now">
    <div><div class="city">ارومیه</div><div class="date">${today}</div>
      <div class="temp">${fa(c.temperature_2m)}<small>°C</small></div>
      <div class="cond">${cond} · احساس واقعی ${fa(c.apparent_temperature)}°</div></div>
    <div class="icon" aria-hidden="true">${emoji}</div>
  </section>

  <section class="card" aria-labelledby="aqh">
    <div class="aqi-top"><h2 id="aqh">کیفیت هوا</h2><span class="aqi-label" style="color:${info[2]}">${info[1]}</span></div>
    <div class="aqi-val" style="color:${info[2]}">${fa(aq)}</div>
    <div class="scale" role="img" aria-label="شاخص کیفیت هوا ${fa(aq)}"><i style="right:${pos}%;border-color:${info[2]}"></i></div>
    <div class="ticks"><span>۰</span><span>۵۰</span><span>۱۰۰</span><span>۱۵۰</span><span>۲۰۰</span><span>۳۰۰+</span></div>
    <p class="advice">${info[3]}</p>
    <h3 style="margin-top:18px">آلاینده‌ها</h3>
    <div class="grid">${poll}</div>
  </section>

  <section class="card">
    <h3>شرایط فعلی</h3>
    <div class="grid">
      <div class="cell"><span>رطوبت</span><b>${fa(c.relative_humidity_2m)}٪</b></div>
      <div class="cell"><span>باد</span><b>${fa(c.wind_speed_10m)}</b><em>km/h ${wind(c.wind_direction_10m)}</em></div>
      <div class="cell"><span>فشار هوا</span><b>${fa(c.pressure_msl)}</b><em>hPa</em></div>
    </div>
  </section>

  <section class="card"><h3>پیش‌بینی هفت روز آینده</h3><div class="days">${days}</div></section>
  <footer>داده‌ها از Open-Meteo · شاخص کیفیت هوا بر پایه استاندارد US AQI</footer>`;
}

load().catch(() => {
  document.getElementById("app").innerHTML = `<div class="card msg">دریافت اطلاعات ممکن نشد. اتصال اینترنت را بررسی و صفحه را دوباره باز کنید.</div>`;
});
setInterval(() => load().catch(()=>{}), 15 * 60 * 1000);
</script>
</body>
  </html>
