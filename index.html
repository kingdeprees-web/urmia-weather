<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--ink:#e9eef3;--mute:#8f9ba8;--gold:#dcbc80;--line:#ffffff17}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#0c0e11;overflow-x:hidden;width:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);line-height:1.65;font-size:15px;min-height:100vh;width:100%;overflow-x:hidden;
  background:radial-gradient(120% 55% at 50% 0%,#252d37 0%,#0c0e11 62%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,#ffffff06 0 1px,transparent 1px 3px)}
.wrap{position:relative;max-width:480px;width:100%;margin:0 auto;overflow-x:hidden}

header{width:100%;position:relative;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
  background:linear-gradient(180deg,#39414b 0%,#1c2026 55%,#2a3038 100%);box-shadow:inset 0 1px 0 #ffffff30,0 8px 20px -10px #000}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#b8925a,#f5e2b8,#b8925a,transparent)}
header img{width:56px;height:56px;flex:none;border-radius:50%;background:#fff;padding:2px;object-fit:cover;
  border:2px solid #dcbc80;box-shadow:0 3px 10px #000a}
header h1{font-size:.95rem;font-weight:800;line-height:1.7;color:#f3f6f9;text-shadow:0 1px 0 #000a;text-align:right}

main{padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 30px);display:grid;grid-template-columns:minmax(0,1fr);gap:14px;width:100%}
main>*{min-width:0}
.card{position:relative;border-radius:22px;padding:18px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(150deg,#2d343c 0%,#191c21 48%,#262c33 100%);
  box-shadow:inset 0 1px 0 #ffffff26,0 14px 28px -16px #000}
.card h2{font-size:.86rem;font-weight:600;color:var(--gold);margin-bottom:14px}

.hero{border-radius:26px;padding:22px 22px 20px;position:relative;overflow:hidden;border:1px solid #ffffff1f;
  background:linear-gradient(150deg,var(--t1),#14181d 58%,var(--t2));
  box-shadow:inset 0 1px 0 #ffffff33,0 18px 34px -18px #000}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 28%,#ffffff17 44%,transparent 60%)}
.hero>*{position:relative}
.sunny{--t1:#42688a;--t2:#22384c}.cloudy{--t1:#56616d;--t2:#2b333c}.rain{--t1:#33455a;--t2:#1b2733}.night{--t1:#2a3352;--t2:#141a2e}
.loc{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.city{font-size:1.2rem;font-weight:800}
.date{font-size:.76rem;color:#cbd5de}
.mid{display:flex;align-items:center;justify-content:space-between;margin:8px 0 0}
.temp{font-size:6.4rem;font-weight:300;line-height:1.15;letter-spacing:-2px;
  background:linear-gradient(180deg,#fff 0%,#d3dbe2 42%,#7f8a95 52%,#e6ecf1 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 8px #0008)}
.emo{font-size:4.4rem;line-height:1;filter:drop-shadow(0 6px 10px #0009)}
.cond{font-size:1.15rem;font-weight:600;margin-top:2px}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.pills span{text-align:center;padding:7px 4px;border-radius:14px;font-size:.74rem;color:#c3cdd7;
  background:linear-gradient(180deg,#ffffff24,#ffffff0a);border:1px solid #ffffff1c}
.pills b{display:block;font-size:1rem;font-weight:600;color:#fff}

.aq{display:flex;justify-content:space-between;align-items:center}
.aq .num{font-size:3rem;font-weight:800;line-height:1}
.aq .lab{text-align:left;font-weight:800;font-size:1.02rem}
.aq .lab small{display:block;font-weight:400;color:var(--mute);font-size:.7rem}
.sc{padding:0 16px}
.scale{position:relative;height:12px;border-radius:99px;margin:18px 0 28px;box-shadow:inset 0 1px 3px #000a;
  background:linear-gradient(to left,#34b46a 0 16.66%,#f0c419 16.66% 33.33%,#ff8a1f 33.33% 50%,#ee4444 50% 66.66%,#a54fb0 66.66% 100%)}
.scale i{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(50%,-50%);
  background:linear-gradient(180deg,#fff,#aeb8c2);border:3px solid #14181d;box-shadow:0 2px 8px #000c}
.scale u{position:absolute;top:19px;font-size:.66rem;color:var(--mute);text-decoration:none;transform:translateX(50%);white-space:nowrap}
.advice{padding:10px 13px;border-radius:13px;font-size:.83rem;color:#e9dcc3;
  background:linear-gradient(180deg,#dcbc8026,#dcbc8010);border:1px solid #dcbc8033}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border-radius:18px;padding:13px 15px;border:1px solid var(--line);min-width:0;
  background:linear-gradient(150deg,#2b3239,#181b20 60%,#22282e);box-shadow:inset 0 1px 0 #ffffff22}
.tile span{display:block;color:var(--mute);font-size:.75rem}
.tile b{font-size:1.3rem;font-weight:600;background:linear-gradient(180deg,#fff,#b9c3cc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tile em{font-style:normal;color:var(--mute);font-size:.7rem;margin-inline-start:5px}
.sun{grid-column:1/-1;display:grid;grid-template-columns:1fr 1px 1fr;gap:12px;text-align:center}
.sun hr{border:0;background:linear-gradient(180deg,transparent,#ffffff33,transparent)}
.sun b{display:block}

.hours{display:flex;gap:9px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hours::-webkit-scrollbar{display:none}
.h{flex:0 0 60px;text-align:center;border-radius:16px;padding:10px 0;border:1px solid var(--line);
  background:linear-gradient(180deg,#2f363e,#1a1e23);box-shadow:inset 0 1px 0 #ffffff1f}
.h.on{background:linear-gradient(180deg,#f3dfb2,#b8925a);color:#20170a;border-color:#f3dfb2}
.h small{display:block;font-size:.7rem;opacity:.75}
.h i{display:block;font-style:normal;font-size:1.5rem;margin:2px 0}
.h b{font-weight:600;font-size:.95rem}

.row{display:grid;grid-template-columns:58px 28px 30px minmax(0,1fr) 30px;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.row:last-child{border:0;padding-bottom:0}
.row .e{font-size:1.3rem;text-align:center}
.row .hi{font-weight:600;text-align:center}
.row .lo{color:var(--mute);text-align:center}
.bar{position:relative;height:6px;border-radius:9px;background:#0009;box-shadow:inset 0 1px 2px #000}
.bar i{position:absolute;top:0;height:100%;border-radius:9px;background:linear-gradient(to left,#c9d3dc,#dcbc80)}

.msg{text-align:center;padding:70px 16px;color:var(--mute)}
.msg button{margin-top:16px;font:inherit;color:#20170a;font-weight:600;border:0;border-radius:14px;padding:10px 28px;background:linear-gradient(180deg,#f3dfb2,#b8925a)}
.warn{color:var(--mute);text-align:center;padding:14px 8px}
footer{text-align:center;color:var(--mute);font-size:.7rem}
</style>
</head>
<body>
<div class="wrap">
<header><img src="logo.jpg" alt="لوگوی انجمن"><h1>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</h1></header>
<main id="app"></main>
</div>

<script>
const LAT=37.5527,LON=45.0761,app=document.getElementById("app");
const D="۰۱۲۳۴۵۶۷۸۹",faS=s=>String(s).replace(/\d/g,d=>D[d]);
const fa=(n,d=0)=>Number(n).toLocaleString("fa-IR",{maximumFractionDigits:d,minimumFractionDigits:d});
const WMO={0:["آسمان صاف","☀️"],1:["کمی ابری","🌤️"],2:["نیمه‌ابری","⛅"],3:["ابری","☁️"],45:["مه‌آلود","🌫️"],48:["مه یخ‌زده","🌫️"],
51:["نم‌نم باران","🌦️"],53:["نم‌نم باران","🌦️"],55:["نم‌نم شدید","🌦️"],61:["باران ملایم","🌧️"],63:["باران","🌧️"],65:["باران شدید","🌧️"],
66:["باران یخ‌زده","🌧️"],67:["باران یخ‌زده","🌧️"],71:["برف ملایم","🌨️"],73:["برف","❄️"],75:["برف سنگین","❄️"],77:["دانه‌های برف","❄️"],
80:["رگبار","🌦️"],81:["رگبار","🌧️"],82:["رگبار شدید","⛈️"],85:["رگبار برف","🌨️"],86:["رگبار برف","🌨️"],95:["رعد و برق","⛈️"],96:["رعد و تگرگ","⛈️"],99:["رعد و تگرگ شدید","⛈️"]};
const AQI=[["هوای پاک","#3ddc84","کیفیت هوا مطلوب است و فعالیت در فضای باز مشکلی ندارد."],
["قابل قبول","#f0c419","برای اغلب افراد مناسب است؛ افراد بسیار حساس مراقب باشند."],
["ناسالم برای گروه‌های حساس","#ff8a1f","کودکان، سالمندان و بیماران قلبی و تنفسی فعالیت طولانی در بیرون را کاهش دهند."],
["ناسالم","#ff5a5a","همه افراد فعالیت سنگین در فضای باز را محدود کنند."],
["بسیار ناسالم","#c26ad0","از فعالیت در فضای باز پرهیز و از ماسک استفاده کنید."],
["خطرناک","#ff2d55","شرایط اضطراری؛ در محیط بسته بمانید."]];
const B=[50,100,150,200,300];
const ico=(c,day=1)=>c<=1&&!day?"🌙":(WMO[c]||["","🌡️"])[1];
const dir=d=>["شمال","شمال‌شرق","شرق","جنوب‌شرق","جنوب","جنوب‌غرب","غرب","شمال‌غرب"][Math.round(d/45)%8];
const dname=s=>new Intl.DateTimeFormat("fa-IR",{weekday:"long"}).format(new Date(s+"T12:00:00"));
const uv=v=>v<3?"کم":v<6?"متوسط":v<8?"زیاد":v<11?"بسیار زیاد":"شدید";
const pdate=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat("fa-IR-u-ca-persian",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.weekday} ${p.day} ${p.month} ${p.year}`};

const WURL=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&timezone=Asia%2FTehran&forecast_days=7`;
const AURL=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi&timezone=Asia%2FTehran`;

async function get(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}
  finally{clearTimeout(t)}
}
async function load(first=true){
  if(first)app.innerHTML='<div class="msg">در حال دریافت اطلاعات…</div>';
  const [w,a]=await Promise.allSettled([get(WURL),get(AURL)]);
  if(w.status!=="fulfilled"&&a.status!=="fulfilled"){
    if(first)app.innerHTML='<div class="msg">اتصال به سرور اطلاعات برقرار نشد.<br>اینترنت (یا فیلترشکن) را بررسی کنید.<br><button onclick="load()">تلاش دوباره</button></div>';
    return;
  }
  render(w.value,a.value);
}

function hero(W){
  if(!W)return '<section class="hero night"><div class="warn">اطلاعات آب‌وهوا در دسترس نیست.</div></section>';
  const c=W.current,d=W.daily,cond=(WMO[c.weather_code]||["نامشخص"])[0];
  const cls=!c.is_day?"night":c.weather_code>=51?"rain":c.weather_code>=3?"cloudy":"sunny";
  return `<section class="hero ${cls}">
    <div class="loc"><div class="city">ارومیه</div><div class="date">${pdate()}</div></div>
    <div class="mid"><div class="temp">${fa(c.temperature_2m)}°</div><div class="emo" aria-hidden="true">${ico(c.weather_code,c.is_day)}</div></div>
    <div class="cond">${cond}</div>
    <div class="pills"><span>بیشینه<b>${fa(d.temperature_2m_max[0])}°</b></span><span>کمینه<b>${fa(d.temperature_2m_min[0])}°</b></span><span>احساس<b>${fa(c.apparent_temperature)}°</b></span></div>
  </section>`;
}

function air(A){
  if(!A)return '<section class="card"><h2>کیفیت هوا</h2><div class="warn">اطلاعات کیفیت هوا در دسترس نیست.</div></section>';
  const v=Math.round(A.current.us_aqi);
  let i=B.findIndex(b=>v<=b);if(i<0)i=5;
  const inf=AQI[i],pos=Math.min(v,300)/300*100;
  const ticks=[[0,"۰"],[16.66,"۵۰"],[33.33,"۱۰۰"],[50,"۱۵۰"],[66.66,"۲۰۰"],[100,"۳۰۰+"]].map(t=>`<u style="right:${t[0]}%">${t[1]}</u>`).join("");
  return `<section class="card"><h2>کیفیت هوا</h2>
    <div class="aq"><div class="num" style="color:${inf[1]}">${fa(v)}</div><div class="lab" style="color:${inf[1]}">${inf[0]}<small>شاخص US AQI</small></div></div>
    <div class="sc"><div class="scale" role="img" aria-label="شاخص کیفیت هوا ${fa(v)}"><i style="right:${pos}%"></i>${ticks}</div></div>
    <div class="advice">${inf[2]}</div></section>`;
}

function tiles(W){
  if(!W)return "";const c=W.current,d=W.daily;
  const T=[["رطوبت",fa(c.relative_humidity_2m)+"٪",""],
    ["باد",fa(c.wind_speed_10m),"km/h "+dir(c.wind_direction_10m)],
    ["تندباد",fa(c.wind_gusts_10m),"km/h"],
    ["احتمال بارش",fa(d.precipitation_probability_max[0]??0)+"٪",""],
    ["فشار هوا",fa(c.pressure_msl),"hPa"],
    ["شاخص UV",fa(d.uv_index_max[0],1),uv(d.uv_index_max[0])]];
  return `<div class="tiles">${T.map(x=>`<div class="tile"><span>${x[0]}</span><b>${x[1]}</b>${x[2]?`<em>${x[2]}</em>`:""}</div>`).join("")}
    <div class="tile sun"><div><span>🌅 طلوع آفتاب</span><b>${faS(d.sunrise[0].slice(11,16))}</b></div><hr><div><span>🌇 غروب آفتاب</span><b>${faS(d.sunset[0].slice(11,16))}</b></div></div></div>`;
}

function hours(W){
  if(!W)return "";const H=W.hourly,i0=Math.max(0,H.time.findIndex(t=>t>=W.current.time.slice(0,13)));
  const items=H.time.slice(i0,i0+24).map((t,k)=>{const h=+t.slice(11,13);
    return `<div class="h${k?"":" on"}"><small>${k?faS(String(h).padStart(2,"0"))+":۰۰":"اکنون"}</small><i>${ico(H.weather_code[i0+k],h>=6&&h<19)}</i><b>${fa(H.temperature_2m[i0+k])}°</b></div>`}).join("");
  return `<section class="card"><h2>ساعت به ساعت</h2><div class="hours">${items}</div></section>`;
}

function days(W){
  if(!W)return "";const d=W.daily,mn=Math.min(...d.temperature_2m_min),mx=Math.max(...d.temperature_2m_max),r=(mx-mn)||1;
  const rows=d.time.map((t,i)=>{const lo=d.temperature_2m_min[i],hi=d.temperature_2m_max[i];
    return `<div class="row"><div>${i===0?"امروز":dname(t)}</div><div class="e">${ico(d.weather_code[i])}</div>
    <div class="lo">${fa(lo)}°</div><div class="bar"><i style="right:${(lo-mn)/r*100}%;width:${Math.max(8,(hi-lo)/r*100)}%"></i></div><div class="hi">${fa(hi)}°</div></div>`}).join("");
  return `<section class="card"><h2>پیش‌بینی هفت روز آینده</h2>${rows}</section>`;
}

function render(W,A){
  const now=new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  app.innerHTML=`${hero(W)}${air(A)}${tiles(W)}${hours(W)}${days(W)}<footer>داده‌ها از Open-Meteo · به‌روزرسانی ${now}</footer>`;
}
load();
setInterval(()=>load(false),15*60*1000);
</script>
</body>
</html>
