<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2540">
<title>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--navy:#0a2540;--navy2:#14416b;--teal:#0e9fbc;--salt:#f3e3da;--bg:#edf1f5;--ink:#122a3d;--mute:#6b8394;--line:#e2e9ef}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--salt);
  display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;position:sticky;top:0;z-index:5}
header img{width:46px;height:46px;flex:none;border-radius:50%;background:#fff;padding:2px;object-fit:cover}
header h1{font-size:.92rem;font-weight:800;line-height:1.55}
main{padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;gap:12px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 2px #0a25400d,0 6px 20px -12px #0a254040}
.card h2{font-size:.9rem;font-weight:600;color:var(--mute);margin-bottom:12px}

.hero{border-radius:24px;color:#fff;padding:20px 20px 18px;position:relative;overflow:hidden;box-shadow:0 12px 28px -14px #0a254099}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:#ffffff14}
.hero::before{width:220px;height:220px;left:-70px;top:-70px}
.hero::after{width:160px;height:160px;left:40px;bottom:-90px}
.hero>*{position:relative;z-index:1}
.sunny{background:linear-gradient(155deg,#0b62ad,#3eb3dc)}
.cloudy{background:linear-gradient(155deg,#41596b,#8aa1b1)}
.rain{background:linear-gradient(155deg,#22364a,#5a7488)}
.night{background:linear-gradient(155deg,#071830,#2a4680)}
.loc{display:flex;justify-content:space-between;align-items:baseline}
.city{font-size:1.15rem;font-weight:800}
.date{font-size:.78rem;opacity:.85}
.mid{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.temp{font-size:5.6rem;font-weight:300;line-height:1.1;letter-spacing:-2px}
.emo{font-size:4.6rem;line-height:1}
.cond{font-size:1.1rem;font-weight:600}
.pills{display:flex;gap:8px;margin-top:12px}
.pills span{flex:1;text-align:center;background:#ffffff26;border-radius:12px;padding:6px 4px;font-size:.78rem;backdrop-filter:blur(4px)}
.pills b{display:block;font-size:.98rem;font-weight:600}

.aq{display:flex;justify-content:space-between;align-items:center;gap:12px}
.aq .num{font-size:2.8rem;font-weight:800;line-height:1}
.aq .lab{font-size:1.02rem;font-weight:800;text-align:left}
.aq .lab small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.scale{position:relative;height:12px;border-radius:99px;margin:16px 0 26px;
  background:linear-gradient(to left,#2e9e5b 0 16.66%,#e6b800 16.66% 33.33%,#ff7e00 33.33% 50%,#e8383d 50% 66.66%,#8f3f97 66.66% 100%)}
.scale i{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--ink);transform:translate(50%,-50%);box-shadow:0 2px 6px #0004}
.scale u{position:absolute;top:18px;font-size:.68rem;color:var(--mute);text-decoration:none;transform:translateX(50%)}
.advice{padding:10px 12px;border-radius:12px;background:var(--salt);color:#4a2b26;font-size:.84rem}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px #0a25400d}
.tile span{display:block;color:var(--mute);font-size:.76rem}
.tile b{font-size:1.2rem;font-weight:600}
.tile em{font-style:normal;color:var(--mute);font-size:.7rem;margin-inline-start:4px}
.tile small{display:block;color:var(--mute);font-size:.7rem;line-height:1.3}

.hours{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.h{flex:0 0 58px;scroll-snap-align:start;text-align:center;border-radius:16px;padding:10px 0;background:#f4f7f9}
.h.on{background:var(--navy);color:#fff}
.h small{display:block;font-size:.72rem;opacity:.75}
.h i{display:block;font-style:normal;font-size:1.5rem;margin:2px 0}
.h b{font-weight:600;font-size:.95rem}

.row{display:grid;grid-template-columns:58px 30px 30px 1fr 30px;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.row:last-child{border:0;padding-bottom:0}
.row .e{font-size:1.3rem;text-align:center}
.row .hi{font-weight:600;text-align:center}
.row .lo{color:var(--mute);text-align:center}
.bar{position:relative;height:6px;border-radius:9px;background:#e6edf1}
.bar i{position:absolute;top:0;height:100%;border-radius:9px;background:linear-gradient(to left,#0e9fbc,#f2a33a)}
.msg{text-align:center;padding:60px 16px;color:var(--mute)}
.msg button{margin-top:14px;font:inherit;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:9px 24px}
.warn{color:var(--mute);text-align:center;padding:16px 8px}
footer{text-align:center;color:var(--mute);font-size:.7rem;line-height:1.8}
@media(min-width:521px){main{padding-top:20px}}
</style>
</head>
<body>
<div class="wrap">
<header><img src="logo.jpg" alt="لوگوی انجمن"><h1>انجمن سازندگان ذیصلاح ساختمان شهرستان ارومیه</h1></header>
<main id="app"></main>
</div>

<script>
const LAT=37.5527,LON=45.0761,app=document.getElementById("app");
const D="۰۱۲۳۴۵۶۷۸۹",faS=s=>String(s).replace(/\d/g,d=>D[d]);
const fa=(n,d=0)=>Number(n).toLocaleString("fa-IR",{maximumFractionDigits:d,minimumFractionDigits:d});
const WMO={0:["آسمان صاف","☀️"],1:["کمی ابری","🌤️"],2:["نیمه‌ابری","⛅"],3:["ابری","☁️"],45:["مه‌آلود","🌫️"],48:["مه یخ‌زده","🌫️"],
51:["نم‌نم باران","🌦️"],53:["نم‌نم باران","🌦️"],55:["نم‌نم شدید","🌦️"],61:["باران ملایم","🌧️"],63:["باران","🌧️"],65:["باران شدید","🌧️"],
66:["باران یخ‌زده","🌧️"],67:["باران یخ‌زده","🌧️"],71:["برف ملایم","🌨️"],73:["برف","❄️"],75:["برف سنگین","❄️"],77:["دانه‌های برف","❄️"],
80:["رگبار","🌦️"],81:["رگبار","🌧️"],82:["رگبار شدید","⛈️"],85:["رگبار برف","🌨️"],86:["رگبار برف","🌨️"],95:["رعد و برق","⛈️"],96:["رعد و تگرگ","⛈️"],99:["رعد و تگرگ شدید","⛈️"]};
const AQI=[["هوای پاک","#2e9e5b","کیفیت هوا مطلوب است و فعالیت در فضای باز مشکلی ندارد."],
["قابل قبول","#c99a00","برای اغلب افراد مناسب است؛ افراد بسیار حساس مراقب باشند."],
["ناسالم برای گروه‌های حساس","#ff7e00","کودکان، سالمندان و بیماران قلبی و تنفسی فعالیت طولانی در بیرون را کاهش دهند."],
["ناسالم","#e8383d","همه افراد فعالیت سنگین در فضای باز را محدود کنند."],
["بسیار ناسالم","#8f3f97","از فعالیت در فضای باز پرهیز و از ماسک استفاده کنید."],
["خطرناک","#7e0023","شرایط اضطراری؛ در محیط بسته بمانید."]];
const B=[50,100,150,200,300];
const ico=(c,day=1)=>c<=1&&!day?"🌙":(WMO[c]||["","🌡️"])[1];
const dir=d=>["شمال","شمال‌شرق","شرق","جنوب‌شرق","جنوب","جنوب‌غرب","غرب","شمال‌غرب"][Math.round(d/45)%8];
const dname=s=>new Intl.DateTimeFormat("fa-IR",{weekday:"long"}).format(new Date(s+"T12:00:00"));
const uv=v=>v<3?"کم":v<6?"متوسط":v<8?"زیاد":v<11?"بسیار زیاد":"شدید";

const WURL=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&timezone=Asia%2FTehran&forecast_days=7`;
const AURL=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=us_aqi&timezone=Asia%2FTehran`;

async function get(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}
  finally{clearTimeout(t)}
}
async function load(first=true){
  if(first)app.innerHTML='<div class="msg">در حال دریافت اطلاعات…</div>';
  const [w,a]=await Promise.allSettled([get(WURL),get(AURL)]);
  if(w.status!=="fulfilled"&&a.status!=="fulfilled"){
    if(first)app.innerHTML='<div class="msg">اتصال به سرور اطلاعات برقرار نشد.<br>اینترنت (یا فیلترشکن) را بررسی کنید.<br><button onclick="load()">تلاش دوباره</button></div>';
    return;
  }
  render(w.value,a.value);
}

function hero(W){
  if(!W)return '<section class="hero night"><div class="warn" style="color:#fff">اطلاعات آب‌وهوا در دسترس نیست.</div></section>';
  const c=W.current,d=W.daily,cond=(WMO[c.weather_code]||["نامشخص"])[0];
  const cls=!c.is_day?"night":c.weather_code>=51?"rain":c.weather_code>=3?"cloudy":"sunny";
  const today=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{day:"numeric",month:"long",weekday:"long"}).format(new Date());
  return `<section class="hero ${cls}">
    <div class="loc"><div class="city">ارومیه</div><div class="date">${today}</div></div>
    <div class="mid"><div class="temp">${fa(c.temperature_2m)}°</div><div class="emo" aria-hidden="true">${ico(c.weather_code,c.is_day)}</div></div>
    <div class="cond">${cond}</div>
    <div class="pills"><span>بیشینه<b>${fa(d.temperature_2m_max[0])}°</b></span><span>کمینه<b>${fa(d.temperature_2m_min[0])}°</b></span><span>احساس<b>${fa(c.apparent_temperature)}°</b></span></div>
  </section>`;
}

function air(A){
  if(!A)return '<section class="card"><h2>کیفیت هوا</h2><div class="warn">اطلاعات کیفیت هوا در دسترس نیست.</div></section>';
  const v=Math.round(A.current.us_aqi);
  let i=B.findIndex(b=>v<=b);if(i<0)i=5;
  const inf=AQI[i],pos=Math.min(v,300)/300*100;
  const ticks=[[0,"۰"],[16.66,"۵۰"],[33.33,"۱۰۰"],[50,"۱۵۰"],[66.66,"۲۰۰"],[100,"۳۰۰+"]].map(t=>`<u style="right:${t[0]}%">${t[1]}</u>`).join("");
  return `<section class="card"><h2>کیفیت هوا</h2>
    <div class="aq"><div class="num" style="color:${inf[1]}">${fa(v)}</div><div class="lab" style="color:${inf[1]}">${inf[0]}<small>شاخص US AQI</small></div></div>
    <div class="scale" role="img" aria-label="شاخص کیفیت هوا ${fa(v)}"><i style="right:${pos}%;border-color:${inf[1]}"></i>${ticks}</div>
    <div class="advice">${inf[2]}</div></section>`;
}

function tiles(W){
  if(!W)return "";const c=W.current,d=W.daily;
  const T=[["رطوبت",fa(c.relative_humidity_2m)+"٪","",""],
    ["باد",fa(c.wind_speed_10m),"km/h "+dir(c.wind_direction_10m),`وزش تا ${fa(c.wind_gusts_10m)}`],
    ["احتمال بارش",fa(d.precipitation_probability_max[0]??0)+"٪","",""],
    ["فشار هوا",fa(c.pressure_msl),"hPa",""],
    ["شاخص UV",fa(d.uv_index_max[0],1),"",uv(d.uv_index_max[0])],
    ["طلوع / غروب",faS(d.sunrise[0].slice(11,16)),"",`غروب ${faS(d.sunset[0].slice(11,16))}`]];
  return `<div class="tiles">${T.map(x=>`<div class="tile"><span>${x[0]}</span><b>${x[1]}</b>${x[2]?`<em>${x[2]}</em>`:""}${x[3]?`<small>${x[3]}</small>`:""}</div>`).join("")}</div>`;
}

function hours(W){
  if(!W)return "";const H=W.hourly,i0=Math.max(0,H.time.findIndex(t=>t>=W.current.time.slice(0,13)));
  const items=H.time.slice(i0,i0+24).map((t,k)=>{const h=+t.slice(11,13);
    return `<div class="h${k?"":" on"}"><small>${k?faS(String(h).padStart(2,"0"))+":۰۰":"اکنون"}</small><i>${ico(H.weather_code[i0+k],h>=6&&h<19)}</i><b>${fa(H.temperature_2m[i0+k])}°</b></div>`}).join("");
  return `<section class="card"><h2>ساعت به ساعت</h2><div class="hours">${items}</div></section>`;
}

function days(W){
  if(!W)return "";const d=W.daily,mn=Math.min(...d.temperature_2m_min),mx=Math.max(...d.temperature_2m_max),r=(mx-mn)||1;
  const rows=d.time.map((t,i)=>{const lo=d.temperature_2m_min[i],hi=d.temperature_2m_max[i];
    return `<div class="row"><div>${i===0?"امروز":dname(t)}</div><div class="e">${ico(d.weather_code[i])}</div>
    <div class="lo">${fa(lo)}°</div><div class="bar"><i style="right:${(lo-mn)/r*100}%;width:${Math.max(8,(hi-lo)/r*100)}%"></i></div><div class="hi">${fa(hi)}°</div></div>`}).join("");
  return `<section class="card"><h2>پیش‌بینی هفت روز آینده</h2>${rows}</section>`;
}

function render(W,A){
  const now=new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  app.innerHTML=`${hero(W)}${air(A)}${tiles(W)}${hours(W)}${days(W)}
  <footer>داده‌ها از Open-Meteo · به‌روزرسانی ${now}</footer>`;
}
load();
setInterval(()=>load(false),15*60*1000);
</script>
</body>
  </html>
